[package]
name = "localmind"
version = "1.0.0-beta.1"
description = "LocalMind: your private AI hub, always nearby."
authors = ["Zelucode <hello@zelucode.com>"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/zelucode/localmind"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "localmind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
aes-gcm = "0.10"
base64 = "0.22"
argon2 = "0.5"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
