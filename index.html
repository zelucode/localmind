<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#1e1e2e" />
    <script>
      // Paint the splash in the user's last theme to avoid a dark/light flash before React mounts
      (function () {
        var t = { bg: '#1e1e2e', text: '#d8dbe8', primary: '#e0a8c5' };
        try {
          var saved = JSON.parse(localStorage.getItem('localmind_boot_theme_v1') || 'null');
          if (saved) t = saved;
        } catch (e) {}
        var r = document.documentElement.style;
        r.setProperty('--boot-bg', t.bg);
        r.setProperty('--boot-text', t.text);
        r.setProperty('--boot-primary', t.primary);
        r.backgroundColor = t.bg;
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalMind - Your private AI hub</title>
    <meta name="description" content="Unified command center for AI tools, LLMs, coding agents, free tool bookmarks, OmniRoute detection, and API key management." />
    <meta property="og:title" content="LocalMind - Desktop AI Dashboard" />
    <meta property="og:description" content="Unified command center for AI tools, LLMs, coding agents, free tool bookmarks, OmniRoute detection, and API key management." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root">
      <div data-tauri-drag-region style="position: fixed; top: 0; left: 0; right: 0; height: 44px;"></div>
      <div id="boot-splash" style="position: fixed; inset: 44px 0 0 0; background: var(--boot-bg); color: var(--boot-text);">
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 28px;">
          <svg width="88" height="88" viewBox="88 88 848 848" style="color: var(--boot-primary);" aria-hidden="true">
            <circle cx="512" cy="512" r="320" fill="none" stroke="currentColor" stroke-width="10" opacity=".35" />
            <g stroke="currentColor" stroke-width="14" stroke-linecap="round" opacity=".55">
              <line x1="512" y1="347" x2="512" y2="250" /><line x1="654.9" y1="594.5" x2="738.9" y2="643" /><line x1="369.1" y1="594.5" x2="285.1" y2="643" />
            </g>
            <circle cx="512" cy="512" r="150" fill="none" stroke="currentColor" stroke-width="30" />
            <circle cx="512" cy="512" r="56" fill="currentColor" />
            <g fill="currentColor" stroke="currentColor" stroke-width="20" stroke-linejoin="round">
              <path d="M-36,-52 L36,-52 L36,52 L0,22.2 L-36,52Z" transform="translate(512 192)" />
              <path d="M-36,-52 L36,-52 L36,52 L0,22.2 L-36,52Z" transform="translate(789.1 672)" />
              <path d="M-36,-52 L36,-52 L36,52 L0,22.2 L-36,52Z" transform="translate(234.9 672)" />
            </g>
          </svg>
          <div role="img" aria-label="LocalMind" style="width: 176px; height: 40px; background: linear-gradient(90deg, var(--boot-text) 0 50.1%, var(--boot-primary) 50.1% 100%); -webkit-mask: url(/wordmark.svg) center / contain no-repeat; mask: url(/wordmark.svg) center / contain no-repeat;"></div>
        </div>
      </div>
    </div>
    <script id="boot-watchdog">
      // If the app never replaces the splash (bundle failed to load, or it crashed before the first
      // render), offer a way out. A frameless window must never be impossible to close.
      (function () {
        var LIMIT_MS = 10000;
        function closeApp() {
          try {
            window.__TAURI_INTERNALS__.invoke('plugin:window|close', { label: 'main' });
          } catch (e) {
            window.close();
          }
        }
        function button(label, onClick) {
          var b = document.createElement('button');
          b.type = 'button';
          b.textContent = label;
          b.addEventListener('click', onClick);
          b.style.cssText =
            'padding:8px 16px;border-radius:8px;border:1px solid var(--boot-primary);background:transparent;' +
            'color:var(--boot-text);font:600 12px system-ui,sans-serif;cursor:pointer;';
          return b;
        }
        setTimeout(function () {
          var splash = document.getElementById('boot-splash');
          if (!splash || !splash.isConnected || document.getElementById('boot-stuck')) return;
          var box = document.createElement('div');
          box.id = 'boot-stuck';
          box.setAttribute('role', 'alert');
          box.style.cssText =
            'position:absolute;left:0;right:0;bottom:48px;display:flex;flex-direction:column;align-items:center;gap:12px;' +
            'font:12px system-ui,sans-serif;color:var(--boot-text);';
          var msg = document.createElement('div');
          msg.textContent = 'LocalMind is taking longer than expected to start.';
          var row = document.createElement('div');
          row.style.cssText = 'display:flex;gap:8px;';
          row.appendChild(button('Reload', function () { location.reload(); }));
          row.appendChild(button('Close', closeApp));
          box.appendChild(msg);
          box.appendChild(row);
          splash.appendChild(box);
        }, LIMIT_MS);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
